# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: dotnet

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
          - os: ubuntu-22.04
            arch: x64
          - os: ubuntu-24.04
            arch: x64
          #- os: ubuntu-26.04
          #  arch: x64
          - os: windows-2022
            arch: x64
          - os: windows-2025-vs2026
            arch: x64

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Xcode (${{ matrix.arch }}, macOS)
        if: contains(matrix.os, 'macos')
        uses: JohnTitor/setup-xcode@ed4e651374114d0a5cc19af4c736aca9a8a9e4f9 #v0.1.1
        with:
          xcode-version: 26.5
        
      - name: Set up dotnet (${{ matrix.arch }}, Ubuntu)
        if: contains(matrix.os, 'ubuntu')
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0
          architecture: ${{ matrix.arch }}
          workloads: maui-android
      
      - name: Set up dotnet (${{ matrix.arch }}, macOS)
        if: contains(matrix.os, 'macos')
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0
          architecture: ${{ matrix.arch }}
          workloads: maui-android, maui-ios, maui-maccatalyst
      
      - name: Set up dotnet (${{ matrix.arch }}, Windows)
        if: contains(matrix.os, 'windows')
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0
          architecture: ${{ matrix.arch }}
          workloads: maui-android, maui-ios, maui-maccatalyst, maui-windows
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore
      
      - name: Test
        run: dotnet test --no-build --verbosity normal
